name: MIA targeted second-pass quality
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'second_pass.py'
      - 'tests/test_second_pass.py'
      - '.github/workflows/mia-second-pass.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: mia-second-pass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  second-pass:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: wikirouge-refined-mia-comparison
          run-id: 45715249856
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: mia-chapter-quality
          run-id: 45719728379
          github-token: ${{ github.token }}
          path: chapter
      - uses: actions/download-artifact@v4
        with:
          name: mia-bilingual-review-registry
          run-id: 45719477640
          github-token: ${{ github.token }}
          path: registry
      - name: Verify new chapter candidates, deferred candidates and documented edition mirror
        run: python second_pass.py --development frozen/reports-live/refined-index.json --holdout frozen/reports-live/holdout-index.json --chapter chapter/chapter-quality.json --registry registry/review-registry.json --certificate review-recipient.crt --packet private-review/second-pass.cms
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mia-second-pass-report
          path: reports-live/second-pass.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: mia-second-pass-encrypted-review
          path: private-review/second-pass.cms
          if-no-files-found: error
          retention-days: 1
