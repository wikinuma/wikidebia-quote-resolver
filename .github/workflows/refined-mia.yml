name: Wikirouge refined retrieval - frozen MIA cohort
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'refinement.py'
      - 'benchmark_refine.py'
      - 'holdout_mia.py'
      - 'source_refinement.py'
      - 'source_evidence.py'
      - 'tests/test_source_refinement.py'
      - 'tests/test_holdout_mia.py'
      - 'bibliographic-catalog.json'
      - 'auto_retrieve.py'
      - 'bibliography.py'
      - 'benchmark_index.py'
      - 'tests/test_refinement.py'
      - '.github/workflows/refined-mia.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: quote-refined-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refined:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-navigation.txt
      - name: Install deterministic dependencies
        run: python -m pip install -r requirements-navigation.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Obtain pinned baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: wikirouge-paired-comparison
          run-id: 45713244614
          github-token: ${{ github.token }}
          path: baseline-report
      - name: Compare indexed and refined retrieval on same 50 MIA citations
        timeout-minutes: 35
        run: python benchmark_refine.py --baseline-report baseline-report/paired-index.json
      - name: Compare both methods on 50 fresh MIA quotations
        timeout-minutes: 30
        run: python benchmark_refine.py --baseline-report baseline-report/paired-index.json --fresh-holdout --out reports-live/holdout-index.json
      - name: Preserve redacted development and holdout reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wikirouge-refined-mia-comparison
          path: |
            reports-live/refined-index.json
            reports-live/holdout-index.json
            baseline-report/paired-index.json
          if-no-files-found: warn
          retention-days: 30
