name: Verify committed historical MIA review memory
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'review_memory.py'
      - 'tests/test_review_memory.py'
      - 'data/mia/**'
      - '.github/workflows/mia-memory.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify frozen memory against the original runner digest
        run: sha256sum -c data/mia/memory.sha256
