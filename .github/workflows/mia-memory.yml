name: Build durable MIA review memory
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'review_memory.py'
      - 'tests/test_review_memory.py'
      - '.github/workflows/mia-memory.yml'
permissions:
  contents: read
  actions: read
jobs:
  memory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - uses: actions/download-artifact@v4
        with:
          name: wikirouge-refined-mia-comparison
          run-id: 45715249856
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: mia-bilingual-review-registry
          run-id: 45719477640
          github-token: ${{ github.token }}
          path: registry
      - uses: actions/download-artifact@v4
        with:
          name: mia-second-pass-report
          run-id: 45772180576
          github-token: ${{ github.token }}
          path: second
      - name: Build and validate compact historical decisions
        run: python review_memory.py --development frozen/reports-live/refined-index.json --holdout frozen/reports-live/holdout-index.json --registry registry/review-registry.json --second second/second-pass.json --emit-redacted
      - uses: actions/upload-artifact@v6
        with:
          name: mia-review-memory
          path: reports-live/mia-review-memory.json
          retention-days: 90
