name: Offline candidate ranking fusion evaluation
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'rank_fusion.py'
      - 'benchmark_rank_fusion.py'
      - 'tests/test_rank_fusion.py'
      - '.github/workflows/mia-rank-fusion.yml'
permissions:
  contents: read
  actions: read
jobs:
  fusion:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -p 'test_rank_fusion.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: mia-semantic-conditional-report
          run-id: 45819797551
          github-token: ${{ github.token }}
          path: frozen
      - run: python benchmark_rank_fusion.py --report frozen/semantic-conditional.json --out reports-live/rank-fusion.json
      - uses: actions/upload-artifact@v6
        with:
          name: mia-rank-fusion-report
          path: reports-live/rank-fusion.json
          retention-days: 90
