name: MIA bilingual review registry
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'review_registry.py'
      - 'first-candidate-review.json'
      - 'tests/test_review_registry.py'
      - '.github/workflows/mia-review-registry.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: mia-review-registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  registry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: wikirouge-refined-mia-comparison
          run-id: 45715249856
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: mia-chapter-quality
          run-id: 45718562215
          github-token: ${{ github.token }}
          path: chapter
      - run: python review_registry.py --development frozen/reports-live/refined-index.json --holdout frozen/reports-live/holdout-index.json --chapter chapter/chapter-quality.json
      - uses: actions/upload-artifact@v6
        with:
          name: mia-bilingual-review-registry
          path: reports-live/review-registry.json
          if-no-files-found: error
          retention-days: 90
