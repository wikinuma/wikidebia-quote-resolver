name: Prepared registry transfer tests
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'registry_transfer.py'
      - 'citation_registry.py'
      - 'tests/test_registry_transfer.py'
      - 'translation_handoff.py'
      - 'prepared_resolution.py'
      - '.github/workflows/registry-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
