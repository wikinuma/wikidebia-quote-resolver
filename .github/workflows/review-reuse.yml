name: Offline campaign reassociation checks
on:
  push:
    branches: ['experiment/mia-campaign-diagnostics-20261128']
    paths:
      - 'review_reuse.py'
      - 'review_history.py'
      - 'tests/test_review_history.py'
      - 'tests/test_review_reuse.py'
      - 'chapter-catalog.json'
      - 'chapter_routes.py'
      - 'tests/test_chapter_routes.py'
      - 'auto_retrieve.py'
      - 'alternative-edition-catalog.json'
      - 'tests/test_auto_retrieve.py'
      - 'bibliography.py'
      - 'tests/test_bibliography.py'
      - 'chapter_quality.py'
      - 'prepare_citations.py'
      - 'campaign_diagnostic.py'
      - 'tests/test_prepare_citations.py'
      - '.github/workflows/review-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -p 'test_review_reuse.py' -v
      - run: python -m unittest discover -s tests -p 'test_review_history.py' -v
      - run: python -m unittest discover -s tests -p 'test_chapter_routes.py' -v
      - run: python -m unittest discover -s tests -p 'test_auto_retrieve.py' -v
      - run: python -m unittest discover -s tests -p 'test_bibliography.py' -v
      - run: python -m unittest discover -s tests -p 'test_campaign_diagnostic.py' -v
      - run: python -m unittest discover -s tests -p 'test_prepare_citations.py' -v
      - run: python -m unittest discover -s tests -p 'test_grouped_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_review_bundle.py' -v
