name: Automatic bilingual table-of-contents probe
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'toc_heading.py'
      - 'toc_structure.py'
      - 'tests/test_toc_structure.py'
      - 'benchmark_toc_heading.py'
      - 'tests/test_toc_heading.py'
      - '.github/workflows/mia-toc-heading.yml'
permissions:
  contents: read
concurrency:
  group: mia-toc-heading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU inference environment
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-navigation.txt numpy==2.2.6 sentence-transformers==4.1.0 transformers==4.51.3 huggingface-hub==0.30.2
          mkdir -p reports-live
          python -m pip freeze > reports-live/semantic-environment.txt
      - name: Regression tests with real numerical arrays
        run: |
          python -m unittest discover -s tests -p 'test_toc_heading.py' -v
          python -m unittest discover -s tests -p 'test_toc_structure.py' -v
      - uses: actions/cache@v4
        with:
          path: local-model
          key: mia-minilm-86741b4e3f5cb7765a600d3a3d55a0f6a6cb443d
      - name: Obtain pinned public safetensors model, no quotation data
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from huggingface_hub import snapshot_download
          d=Path(snapshot_download(repo_id='sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2',
              revision='86741b4e3f5cb7765a600d3a3d55a0f6a6cb443d',token=False,
              allow_patterns=['config.json','config_sentence_transformers.json','model.safetensors',
              'modules.json','sentence_bert_config.json','sentencepiece.bpe.model','special_tokens_map.json',
              'tokenizer.json','tokenizer_config.json','1_Pooling/config.json'],local_dir='local-model'))
          with (d/'model.safetensors').open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()=='eaa086f0ffee582aeb45b36e34cdd1fe2d6de2bef61f8a559a1bbc9bd955917b'
          print('model_bytes='+str(sum(p.stat().st_size for p in d.rglob('*') if p.is_file())))
          PY
      - name: Test automatic TOC hypotheses without supplying child target URLs
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python benchmark_toc_heading.py --model-dir local-model --cache private-cache
          python benchmark_toc_heading.py --structure-v2 --model-dir local-model --cache private-cache --out reports-live/toc-structure-benchmark.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mia-toc-heading-report
          path: |
            reports-live/toc-heading-benchmark.json
            reports-live/toc-structure-benchmark.json
            reports-live/semantic-environment.txt
          if-no-files-found: warn
          retention-days: 90
