name: Quote resolver - public source pilot
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quote-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Live pilot and strict offline replay
        run: python ci/run_pilot.py
      - name: Preserve redacted reports even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quote-pilot-reports
          path: |
            reports-live/full-work.json
            reports-live/full-work-replay.json
            reports-live/ci-summary.json
            reports-live/preferred-offline.json
          if-no-files-found: warn
          retention-days: 7
  navigation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-navigation.txt
      - name: Install navigation dependencies
        run: python -m pip install -r requirements-navigation.txt
      - name: Navigation regression tests
        run: |
          python -m unittest discover -s tests -p 'test_navigation.py' -v
          python -m unittest discover -s tests -p 'test_auto_retrieve.py' -v
          python -m unittest discover -s tests -p 'test_section_match.py' -v
          python -m unittest discover -s tests -p 'test_inventory.py' -v
          python -m unittest discover -s tests -p 'test_bibliography.py' -v
          python -m unittest discover -s tests -p 'test_window_rank.py' -v
      - name: Metadata routes and offline replay
        run: python navigation.py --replay
      - name: Automatic quotation candidate retrieval and replay
        run: python auto_retrieve.py --replay
      - name: Preserve bibliographic navigation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quote-navigation-reports
          path: |
            reports-live/navigation.json
            reports-live/navigation-replay.json
            reports-live/auto-candidates.json
            reports-live/auto-candidates-replay.json
          if-no-files-found: warn
          retention-days: 7
  inventory:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-navigation.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-navigation.txt
      - name: Inventory regression tests
        run: python -m unittest discover -s tests -p 'test_inventory.py' -v
      - name: Discover and evaluate candidate coverage
        run: python inventory.py --catalog bibliographic-catalog.json --replay
      - name: Expanded independent sample (no catalog)
        run: python inventory.py --batches 4 --scan-pages 60 --sample 12 --balance-authors --exclude-file development-inventory.json --max-work-pages 32 --budget 400 --out reports-live/expanded-inventory.json --replay
      - name: Preserve redacted inventory reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quote-inventory-reports
          path: |
            reports-live/inventory.json
            reports-live/inventory-replay.json
            reports-live/expanded-inventory.json
            reports-live/expanded-inventory-replay.json
          if-no-files-found: warn
          retention-days: 7
