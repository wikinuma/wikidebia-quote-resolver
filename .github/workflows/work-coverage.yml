name: MIA work-level coverage census
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'work_coverage.py'
      - 'tests/test_work_coverage.py'
      - '.github/workflows/work-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -p 'test_work_coverage.py' -v
      - run: python work_coverage.py --live-limit 12
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mia-work-coverage
          path: reports-live/work-coverage.json
          retention-days: 90
