name: Work library repeated-work benchmark
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'work_library.py'
      - 'benchmark_work_library.py'
      - 'tests/test_work_library.py'
      - '.github/workflows/work-library.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -p 'test_work_library.py' -v
      - run: python benchmark_work_library.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: work-library-report
          path: reports-live/work-library.json
          retention-days: 90
