name: Citation link domain census
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'citation_policy.py'
      - 'citation_domain_census.py'
      - 'tests/test_citation_domain_census.py'
      - '.github/workflows/citation-domain-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -p 'test_citation_domain_census.py' -v
      - run: python citation_domain_census.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: citation-domain-census
          path: reports-live/citation-domains.json
          retention-days: 90
