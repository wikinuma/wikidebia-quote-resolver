name: MIA historical review reuse
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - review_reuse.py
      - benchmark_memory_reuse.py
      - tests/test_review_reuse.py
      - .github/workflows/mia-memory-reuse.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -p 'test_review_reuse.py' -v
      - run: python benchmark_memory_reuse.py
      - uses: actions/upload-artifact@v6
        with:
          name: mia-memory-reuse
          path: reports-live/memory-reuse.json
          retention-days: 90
