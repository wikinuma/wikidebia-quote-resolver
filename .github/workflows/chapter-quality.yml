name: MIA chapter quality and reviewed quotation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'chapter_routes.py'
      - 'chapter_quality.py'
      - 'chapter-catalog.json'
      - 'reviewed-quotations.json'
      - 'tests/test_chapter_routes.py'
      - '.github/workflows/chapter-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mia-chapter-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: wikirouge-refined-mia-comparison
          run-id: 45715249856
          github-token: ${{ github.token }}
          path: frozen
      - name: Check targeted chapters and reviewed passage
        run: python chapter_quality.py --development frozen/reports-live/refined-index.json --development-sha 368a2ad617ab504838634dbf328ef4776a25bda9b45ae13d9c7061d6c24bedfd --holdout frozen/reports-live/holdout-index.json --holdout-sha 0a1d137fa16b1ff15e897e8d75fe6d37aa89a02adad32f9b5c8f24799f5ed18b
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mia-chapter-quality
          path: reports-live/chapter-quality.json
          if-no-files-found: warn
          retention-days: 30
