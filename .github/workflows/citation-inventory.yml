name: Full literal MIA citation inventory
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'citation_inventory.py'
      - 'tests/test_citation_inventory.py'
      - '.github/workflows/citation-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
      - name: Enumerate current eligible citations without fetching cited sources
        run: |
          set -o pipefail
          python citation_inventory.py --inventory .cache/mia-inventory.json | tee "${RUNNER_TEMP}/citation-inventory-summary.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-mia-inventory-summary
          path: ${{ runner.temp }}/citation-inventory-summary.json
          if-no-files-found: warn
          retention-days: 90
