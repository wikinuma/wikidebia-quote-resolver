name: Persistent alignment checks
on:
  pull_request:
    branches: ['experiment/citation-domain-census', 'experiment/pilot-v04']
    paths:
      - 'alignment_store.py'
      - 'tests/test_alignment_store.py'
      - 'benchmark_alignment_store.py'
      - '.github/workflows/alignment-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alignments:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
      - run: python benchmark_alignment_store.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: alignment-store-report
          path: reports-live/alignment-store.json
          retention-days: 90
