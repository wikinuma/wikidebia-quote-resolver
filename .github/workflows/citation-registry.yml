name: Prepared citation registry checks
on:
  pull_request:
    branches: ['experiment/persistent-document-alignments', 'experiment/pilot-v04']
    paths:
      - 'citation_registry.py'
      - 'tests/test_citation_registry.py'
      - '.github/workflows/citation-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python -m unittest discover -s tests -v
