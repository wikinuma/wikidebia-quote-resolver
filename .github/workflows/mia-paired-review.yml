name: Temporary paired first-pass review packet
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'experiments/paired_review_packet.py'
      - 'experiments/paired-review-recipient.crt'
      - '.github/workflows/mia-paired-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  packet:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - uses: actions/download-artifact@v4
        with:
          name: mia-integrated-report
          run-id: 45831925252
          github-token: ${{ github.token }}
          path: frozen
      - run: PYTHONPATH=. python experiments/paired_review_packet.py --report frozen/integrated-mia.json --certificate experiments/paired-review-recipient.crt --out private-review/paired.cms
      - uses: actions/upload-artifact@v6
        with:
          name: mia-paired-encrypted-review
          path: private-review/paired.cms
          if-no-files-found: error
          retention-days: 1
