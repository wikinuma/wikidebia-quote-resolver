name: Temporary encrypted review of three restored MIA cases
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'review_restored.py'
      - 'experiments/review-recipient.crt'
      - '.github/workflows/mia-restored-review.yml'
permissions:
  contents: read
jobs:
  packet:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - run: python review_restored.py --certificate experiments/review-recipient.crt --out private-review/restored.cms
      - uses: actions/upload-artifact@v6
        with:
          name: mia-restored-encrypted-review
          path: private-review/restored.cms
          if-no-files-found: error
          retention-days: 1
