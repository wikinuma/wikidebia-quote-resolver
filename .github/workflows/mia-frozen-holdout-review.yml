name: Reauthenticate frozen independent holdout candidates
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    types: [synchronize]
    paths:
      - '.github/workflows/mia-frozen-holdout-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  packet:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - uses: actions/download-artifact@v4
        with:
          name: mia-independent-holdout-report
          run-id: 45840438647
          github-token: ${{ github.token }}
          path: frozen
      - run: PYTHONPATH=. python experiments/holdout_review_packet.py --report frozen/independent-mia.json --certificate experiments/independent-holdout-recipient.crt --out private-review/independent-restored.cms
      - uses: actions/upload-artifact@v6
        with:
          name: mia-independent-restored-review
          path: private-review/independent-restored.cms
          if-no-files-found: error
          retention-days: 1
