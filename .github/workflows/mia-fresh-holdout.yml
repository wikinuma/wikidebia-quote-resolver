name: Fresh 50-case MIA holdout
on:
  pull_request:
    branches: ['experiment/pilot-v04']
    paths:
      - 'fresh_mia_holdout.py'
      - 'tests/test_fresh_mia_holdout.py'
      - '.github/workflows/mia-fresh-holdout.yml'
permissions:
  contents: read
concurrency:
  group: fresh-mia-holdout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  holdout:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-navigation.txt
      - name: Verify holdout selection tests
        run: python -m unittest discover -s tests -p 'test_fresh_mia_holdout.py' -v
      - name: Discover and freeze 50 genuinely fresh quote fingerprints
        run: python fresh_mia_holdout.py --stage discover --inventory reports-live/fresh-mia-inventory.json --inventory-sha reports-live/fresh-mia-inventory.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: fresh-mia-frozen-inventory
          path: |
            reports-live/fresh-mia-inventory.json
            reports-live/fresh-mia-inventory.sha256
          retention-days: 90
      - name: Retrieve and independently authenticate only the frozen sample
        run: python fresh_mia_holdout.py --stage retrieve --inventory reports-live/fresh-mia-inventory.json --inventory-sha reports-live/fresh-mia-inventory.sha256 --certificate experiments/fresh-review-recipient.crt --packet private-review/fresh-mia.cms
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fresh-mia-holdout-report
          path: reports-live/fresh-mia-holdout.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fresh-mia-encrypted-review
          path: private-review/fresh-mia.cms
          if-no-files-found: ignore
          retention-days: 1
